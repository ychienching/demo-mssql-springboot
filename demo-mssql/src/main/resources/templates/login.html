<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Login V5</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<head th:include="common :: css"></head>
</head>
<body>
	
	<div class="limiter">
		<div class="container-login100" th:style="'background-image: url('+ @{/images/bg-01.jpg} +');'">
			<div class="wrap-login100 p-l-110 p-r-110 p-t-62 p-b-33">
				<span class="login100-form-title p-b-53">
					Test System
				</span>
				<span class="login100-form-title p-b-53">
					Login
				</span>

				<a style="display: none;" href="#" class="btn-face m-b-20">
					<i class="fa fa-facebook-official"></i>
					Facebook
				</a>

				<a style="display: none;" href="#" class="btn-google m-b-20">
					<img th:src="@{/images/icons/icon-google.png}" alt="GOOGLE">
					Google
				</a>
				
				<div class="p-t-31 p-b-9">
					<span class="txt1">
						Account
					</span>
				</div>
				<div class="wrap-input100 validate-input" data-validate = "Account is required">
					<input class="input100" type="text" name="account" >
					<span class="focus-input100"></span>
				</div>
				
				<div class="p-t-13 p-b-9">
					<span class="txt1">
						Password
					</span>

					<a href="#" class="txt2 m-l-5">
						Forgot?
					</a>
				</div>
				<div class="wrap-input100 validate-input" data-validate = "Password is required">
					<input class="input100" type="password" name="password" >
					<span class="focus-input100"></span>
				</div>
				
				<div class="container-login100-form-btn m-t-17">
					<button class="login100-form-btn" id="loginBtn">
						Login
					</button>
				</div>

				<div class="container-login100-form-btn m-t-17" style="display: none;">
					<button class="login100-form-btn" id="testBtn">
						Test
					</button>
				</div>

				<div class="container-login100-form-btn m-t-17" style="display: none;">
					<button class="login100-form-btn" id="test2Btn">
						Test2
					</button>
				</div>
				
				<div class="w-full text-center p-t-55">
					<span class="txt2">
						Not a member?
					</span>

					<a th:href="@{/?page=signUp}" class="txt2">
						Sign up now
					</a>
					<br>
					<a style="display: none;" th:href="@{/{temp}/?page=signUp(temp=${path})}">用戶詳情</a>
					<a style="display: none;" th:href="@{/{temp}/?page=signUp(temp=${test})}">用戶詳情2</a>
				</div>
			</div>
		</div>
	</div>
	
<!-- JS ===============================================================================================-->
	<body th:include="common :: js"></body>
	<script th:src="@{/js/utility.js}"></script>
	<script th:src="@{/js/login.js}"></script>

</body>
</html>
