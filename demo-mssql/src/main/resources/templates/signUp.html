<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Login V5</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<head th:include="common :: css"></head>
	<link rel="stylesheet" type="text/css" th:href="@{/css/signUp.css}">
	<!-- <link rel="stylesheet" href="D:\all\test\demo-mssql\src\main\resources\static\css\custom.css"> -->
<!--===============================================================================================-->
</head>
<body>
	
	<div class="limiter">
		<div class="container-login100" th:style="'background-image: url('+ @{/images/bg-01.jpg} +');'">
			<div class="wrap-login100 p-l-110 p-r-110 p-t-62 p-b-33">
				<span class="login100-form-title p-b-53">
					Sign Up
				</span>
				
				<div class="p-t-31 p-b-9">
					<span class="txt1">
						Account
					</span>
				</div>
				<div class="wrap-input100 validate-input" data-validate = "Account is required">
					<input class="input100" type="text" name="account" >
					<span class="focus-input100"></span>
				</div>
				
				<div class="p-t-13 p-b-9">
					<span class="txt1">
						Password
					</span>
				</div>
				<div class="wrap-input100 validate-input" data-validate = "Password is required">
					<input class="input100" type="password" name="password" >
					<span class="focus-input100"></span>
				</div>


				<div class="container-login100-form-btn m-t-17">
					<button class="login100-form-btn" id="signUpBtn">
						Sign Up
					</button>
				</div>

				<br>
				<a th:href="@{/?page=login}" class="txt2">
					Back to login
				</a>
				<a style="display: none;" th:href="@{/{temp}/?page=signUp(temp=${test})}">用戶詳情</a>
				<div>
					<div class="spinner-border" role="status">
						<span class="visually-hidden">Loading...</span>
					</div>
				</div>

				
			</div>
		</div>
	</div>
	
<!-- JS ===============================================================================================-->
	<body th:include="common :: js"></body>
	<script th:src="@{/js/utility.js}"></script>
	<script th:src="@{/js/signUp.js}"></script>

</body>
</html>
